<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
/*__STYLES__*/
</style>
</head>
<body>
<div id="app">
  <!-- ============================== Header: frame, steps, menu ============================== -->
  <header class="topbar">
    <div class="pop-anchor">
      <button class="frame-btn" id="frameBtn" data-act="toggle-frames" data-tip="Choose the banner frame to edit">
        <i data-icon="frame"></i><span id="frameLabel">No frame</span><i data-icon="chevron-down-sm"></i>
      </button>
      <div class="menu" id="frameMenu" hidden></div>
    </div>
    <nav class="stepper" id="stepper" role="tablist" aria-label="Steps"></nav>
    <div class="pop-anchor right">
      <button class="icon-btn" data-act="toggle-more" data-tip="More actions"><i data-icon="more"></i></button>
      <div class="menu" id="moreMenu" hidden></div>
    </div>
  </header>

  <main class="workspace">
    <!-- ============================== Left: the current step ============================== -->
    <aside class="side">
      <!-- 1 · Layers -->
      <section class="step" id="step-layers" role="tabpanel" aria-label="Layers">
        <div class="toolbar">
          <label class="search"><i data-icon="search"></i><input id="search" type="search" placeholder="Search layers" aria-label="Search layers"></label>
          <button class="icon-btn" id="filtersBtn" data-act="toggle-filters" data-tip="Filter layers"><i data-icon="filter"></i></button>
          <button class="icon-btn" data-act="select-parent" data-tip="Select parent on canvas"><i data-icon="arrow-up"></i></button>
          <button class="icon-btn" data-act="add-selection" data-tip="Add canvas selection to banner" data-key="A"><i data-icon="plus"></i></button>
        </div>
        <div id="filters" class="filters" hidden></div>
        <div id="tree" class="tree scroll" role="tree" aria-label="Layers"></div>
        <div id="inspector" class="inspector"></div>
        <footer class="side-foot">
          <span id="layersCount" class="muted"></span>
          <button class="btn primary" data-act="go-animate">Next: Animate</button>
        </footer>
      </section>

      <!-- 2 · Animate -->
      <section class="step" id="step-animate" role="tabpanel" aria-label="Animate" hidden>
        <div class="scroll">
          <div class="section" id="timelineSection"></div>
          <div class="section els-section">
            <div class="section-head"><h3>Layers</h3><span id="elsHint" class="muted"></span></div>
            <div id="bulkEls" class="bulk" hidden></div>
            <div id="elements" class="elements"></div>
          </div>
        </div>
        <footer class="side-foot">
          <button class="btn ghost" data-act="go-layers">Back</button>
          <span class="grow"></span>
          <button class="btn primary" data-act="go-export">Next: Export</button>
        </footer>
      </section>

      <!-- 3 · Export -->
      <section class="step" id="step-export" role="tabpanel" aria-label="Export" hidden>
        <div class="scroll" id="exportBody"></div>
        <footer class="side-foot">
          <button class="btn" data-act="package-preview" data-tip="Play every size side by side">Preview all</button>
          <span class="grow"></span>
          <button class="btn primary" id="downloadAllBtn" data-act="download-all"><i data-icon="download"></i><span id="downloadLabel">Download</span></button>
        </footer>
      </section>
    </aside>

    <!-- ============================== Right: preview ============================== -->
    <section class="stage-col">
      <div id="stage" class="stage">
        <div id="frameBox" class="frame-box" hidden><iframe id="preview" title="Banner preview" sandbox="allow-scripts"></iframe></div>
        <div id="stageMsg" class="stage-msg"></div>
        <div class="zoom" id="zoomBar">
          <button class="icon-btn" data-act="zoom-out" data-tip="Zoom out" data-key="−"><i data-icon="minus"></i></button>
          <button class="zoom-label" data-act="zoom-fit" data-tip="Zoom to fit" id="zoomLabel">100%</button>
          <button class="icon-btn" data-act="zoom-in" data-tip="Zoom in" data-key="+"><i data-icon="plus"></i></button>
        </div>
      </div>
      <div class="transport">
        <button class="icon-btn" id="playBtn" data-act="play" data-tip="Play" data-key="Space"><i data-icon="play"></i></button>
        <button class="icon-btn" data-act="restart" data-tip="Play from start"><i data-icon="restart"></i></button>
        <div class="scrub-wrap">
          <div id="sceneMarks" class="scene-marks"></div>
          <input id="scrubber" type="range" min="0" max="10" step="0.01" value="0" aria-label="Timeline position">
        </div>
        <span id="timeLabel" class="num muted time">0.0 / 0.0 s</span>
        <div class="frame-nav">
          <button class="icon-btn" data-act="scene-prev" data-tip="Previous frame" data-key="←"><i data-icon="chevron-left"></i></button>
          <span id="sceneLabel" class="scene-label num">F1</span>
          <button class="icon-btn" data-act="scene-next" data-tip="Next frame" data-key="→"><i data-icon="chevron-right"></i></button>
        </div>
        <button class="icon-btn" id="outlineBtn" data-act="toggle-outline" data-tip="Show layer outlines" data-key="O"><i data-icon="eye"></i></button>
      </div>
    </section>
  </main>
</div>

<!-- ============================== Dialogs ============================== -->
<div id="previewSheet" class="dialog-wrap" hidden>
  <div class="dialog wide" role="dialog" aria-label="Preview all sizes">
    <div class="dialog-head">
      <h2>Preview all sizes</h2>
      <button class="btn" data-act="replay-all"><i data-icon="restart"></i>Replay</button>
      <button class="icon-btn" data-act="close-preview" data-tip="Close" data-key="Esc"><i data-icon="close"></i></button>
    </div>
    <div class="dialog-body previews" id="previewBody"></div>
  </div>
</div>

<div id="syncSheet" class="dialog-wrap" hidden>
  <div class="dialog" role="dialog" aria-label="Copy animation to other sizes">
    <div class="dialog-head">
      <h2>Copy animation to other sizes</h2>
      <button class="icon-btn" data-act="close-sync" data-tip="Close" data-key="Esc"><i data-icon="close"></i></button>
    </div>
    <div class="dialog-body" id="syncBody"></div>
    <div class="dialog-foot">
      <span class="muted grow">Layers are matched by name. Animation already on those sizes is replaced.</span>
      <button class="btn primary" data-act="apply-sync">Copy animation</button>
    </div>
  </div>
</div>

<div id="keysSheet" class="dialog-wrap" hidden>
  <div class="dialog" role="dialog" aria-label="Keyboard shortcuts">
    <div class="dialog-head">
      <h2>Keyboard shortcuts</h2>
      <button class="icon-btn" data-act="close-keys" data-tip="Close" data-key="Esc"><i data-icon="close"></i></button>
    </div>
    <div class="dialog-body" id="keysBody"></div>
  </div>
</div>

<div id="toast" role="status" aria-live="polite" hidden></div>

<script>
//__UI__
</script>
</body>
</html>

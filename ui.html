<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
:root {
  --app: #e4e5ea;
  --panel: #eeeff2;
  --card: #ffffff;
  --card-2: #f6f6f9;
  --border: #dcdde3;
  --border-strong: #c8c9d2;
  --text: #1c1d26;
  --muted: #6c6f7c;
  --brand: #2a2d86;
  --brand-2: #3c40b8;
  --brand-soft: #e7e8f8;
  --green: #2f8a55;
  --green-soft: #ecf6ef;
  --green-line: #3d9d64;
  --danger: #d2422d;
  --warn: #b26a00;
  --in: #3d9d64;
  --out: #d2422d;
  --loop: #7b5cff;
  --shadow: 0 1px 2px rgba(20, 22, 40, .06), 0 2px 8px rgba(20, 22, 40, .05);
  --radius: 10px;
}
.figma-dark {
  --app: #1b1c21;
  --panel: #23242b;
  --card: #2c2d35;
  --card-2: #33343d;
  --border: #3c3d47;
  --border-strong: #4a4b57;
  --text: #ecedf2;
  --muted: #9a9caa;
  --brand: #8c90ff;
  --brand-2: #a3a6ff;
  --brand-soft: #34355a;
  --green: #6bcf93;
  --green-soft: #243a2d;
  --green-line: #4caf74;
  --shadow: none;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font: 12px/1.4 Inter, -apple-system, "Segoe UI", Roboto, sans-serif;
  color: var(--text);
  background: var(--app);
  overflow: hidden;
}
button, input, select { font: inherit; color: inherit; }
[hidden] { display: none !important; }
.grow { flex: 1; }
.muted { color: var(--muted); }
.mono { font-variant-numeric: tabular-nums; }
svg.ic { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

#app { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; height: 100%; padding: 10px; }
.panel { background: var(--panel); border-radius: 14px; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }

/* ---------- buttons & fields ---------- */
.btn, .text-btn, .icon-btn, .mini-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: 1px solid var(--border); background: var(--card); border-radius: 8px;
  padding: 6px 12px; cursor: pointer; white-space: nowrap; font-weight: 500;
}
.btn:hover, .icon-btn:hover, .mini-btn:hover { border-color: var(--border-strong); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.primary:hover { background: var(--brand-2); }
.btn:disabled, .btn.primary:disabled { opacity: .45; cursor: default; }
.text-btn { border-color: transparent; background: transparent; color: var(--muted); padding: 6px 8px; }
.text-btn:hover { color: var(--text); }
.icon-btn { width: 34px; height: 34px; padding: 0; }
.icon-btn.ghost { border-color: transparent; background: transparent; }
.icon-btn.ghost:hover { background: var(--card); }
.icon-btn.on { background: var(--brand); border-color: var(--brand); color: #fff; }
.icon-btn.sm { width: 28px; height: 28px; border-radius: 7px; }
.icon-btn.danger:hover { color: var(--danger); }
.mini-btn { padding: 2px 8px; min-width: 26px; height: 26px; border-radius: 6px; }
.mini-btn.strong { font-weight: 600; }
select, input[type=text], input[type=number], input[type=url] {
  border: 1px solid var(--border); background: var(--card); border-radius: 8px; padding: 6px 8px; min-width: 0; outline: none;
}
select:focus, input:focus { border-color: var(--brand-2); box-shadow: 0 0 0 2px var(--brand-soft); }
.unit { position: relative; display: block; }
.unit input { width: 100%; padding-right: 22px; }
.unit::after { content: attr(data-unit); position: absolute; right: 8px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 11px; pointer-events: none; }

/* ---------- left panel ---------- */
.pane-card.toolbar { display: flex; align-items: center; gap: 8px; margin: 10px 10px 0; padding: 8px; background: var(--card-2); border-radius: 12px; }
.search-row { display: flex; gap: 8px; padding: 10px; }
.search { flex: 1; display: flex; align-items: center; gap: 6px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 0 10px; color: var(--muted); }
.search input { border: 0; background: transparent; flex: 1; padding: 7px 0; box-shadow: none !important; color: var(--text); }
.filters { margin: 0 10px 8px; padding: 10px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.chip { border: 1px solid var(--border); background: var(--card); border-radius: 999px; padding: 3px 10px; cursor: pointer; }
.chip.on { background: var(--brand); color: #fff; border-color: var(--brand); }
.bulk { margin: 0 10px 8px; padding: 8px 10px; background: var(--brand-soft); border-radius: 10px; display: flex; gap: 8px; align-items: center; }
.tree { flex: 1; overflow-y: auto; padding: 0 10px 10px; }
.node {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 8px;
  box-shadow: var(--shadow); border-left-width: 1px;
}
.node.in-html { background: var(--green-soft); border-left: 3px solid var(--green-line); }
.node.canvas-sel { border-color: var(--brand); box-shadow: 0 0 0 1.5px var(--brand); }
.node .row { display: flex; align-items: center; gap: 8px; padding: 10px 10px 6px; }
.node .row2 { display: flex; align-items: center; gap: 6px; padding: 0 10px 10px 10px; }
.node .row2 select { padding: 5px 6px; }
.node .info { flex: 1; min-width: 0; }
.node .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.node .meta { color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.node .meta .ok { color: var(--green); font-weight: 600; }
.node .meta .hid { color: var(--warn); }
.caret { width: 20px; height: 20px; border: 0; background: transparent; cursor: pointer; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; padding: 0; }
.caret.closed svg { transform: rotate(-90deg); }
.caret-space { width: 20px; flex: none; }
.cb { width: 16px; height: 16px; accent-color: var(--brand); flex: none; }
.type-ic { width: 26px; height: 26px; border-radius: 6px; background: var(--card-2); display: inline-flex; align-items: center; justify-content: center; color: var(--muted); flex: none; }
.add-btn { min-width: 86px; }
.add-btn.remove { background: var(--card); }
.clip-btn.on { color: var(--green); border-color: var(--green-line); background: var(--green-soft); }
.empty { text-align: center; color: var(--muted); padding: 30px 16px; }

.status-bar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-top: 1px solid var(--border); background: var(--card-2); min-height: 46px; }
.status { display: flex; align-items: center; gap: 6px; color: var(--muted); min-width: 0; flex: 1; }
.status span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- right panel ---------- */
.right-scroll { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 10px 10px 0; }
.right-scroll > * { flex: none; }
.top-row { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
.size-select { font-weight: 600; padding: 7px 10px; max-width: 260px; }
.frames-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
.frames-row .label { font-weight: 700; color: var(--muted); letter-spacing: .04em; font-size: 11px; }
.frames-row .count { font-weight: 700; min-width: 16px; text-align: center; }
.inline-field { display: flex; align-items: center; gap: 6px; color: var(--muted); }
.inline-field select { padding: 4px 6px; }
.inline-check { display: flex; align-items: center; gap: 5px; color: var(--muted); }
.scene-durations { display: flex; gap: 6px; margin-top: 8px; }
.scene-dur { position: relative; min-width: 56px; }
.scene-dur input { width: 100%; text-align: center; font-weight: 600; background: var(--card-2); border-color: transparent; padding-right: 18px; }
.scene-dur.cur input { border-color: var(--brand-2); background: var(--card); }
.scene-dur::after { content: 's'; position: absolute; right: 8px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 11px; }
.scene-dur .tag { position: absolute; left: 7px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 10px; font-weight: 600; }
#scrubber { width: 100%; margin: 10px 0 4px; accent-color: #b9a225; }
.transport { display: flex; align-items: center; gap: 4px; }
.scene-label { font-weight: 700; min-width: 26px; text-align: center; }

.stage {
  position: relative; height: 300px; margin-top: 8px; padding-bottom: 40px; border-radius: 12px; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  background-color: var(--card);
  background-image: linear-gradient(45deg, var(--card-2) 25%, transparent 25%), linear-gradient(-45deg, var(--card-2) 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, var(--card-2) 75%), linear-gradient(-45deg, transparent 75%, var(--card-2) 75%);
  background-size: 16px 16px; background-position: 0 0, 0 8px, 8px -8px, -8px 0;
}
.frame-box { position: relative; flex: none; box-shadow: 0 0 0 1px var(--border-strong); }
#preview { border: 0; display: block; transform-origin: 0 0; background: transparent; }
.stage-msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; color: var(--muted); padding: 24px; }
.zoom { position: absolute; right: 10px; bottom: 10px; display: flex; align-items: center; gap: 4px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 3px; }
.zoom span { min-width: 42px; text-align: center; color: var(--muted); }
.warnings { color: var(--warn); font-size: 11px; margin-top: 6px; }
.warnings:empty { display: none; }

.elements { flex: 1 1 auto !important; min-height: 120px; overflow-y: auto; margin: 10px -10px 0; padding: 0 10px 10px; }
.el {
  background: var(--card); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 8px; box-shadow: var(--shadow);
}
.el.open { border-color: var(--brand-2); box-shadow: 0 0 0 1px var(--brand-2); }
.el.off-scene .el-head .name { color: var(--muted); }
.el-head { display: flex; align-items: center; gap: 8px; padding: 10px; cursor: pointer; }
.el-head .name { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.order { display: flex; flex-direction: column; }
.order button { border: 0; background: transparent; cursor: pointer; padding: 0 2px; height: 13px; color: var(--muted); display: flex; align-items: center; }
.order button:hover { color: var(--text); }
.order svg { width: 14px; height: 14px; }
.link-btn.on { color: var(--brand-2); background: var(--brand-soft); border-color: var(--brand-soft); }
.el-body { padding: 0 14px 14px; }
.scene-bars { display: flex; gap: 8px; margin-bottom: 12px; }
.scene-bar {
  flex: 1; height: 26px; border-radius: 8px; border: 1px solid var(--border); background: var(--card-2); cursor: pointer;
  display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: var(--muted);
}
.scene-bar.on { background: var(--brand); border-color: var(--brand); color: #fff; }
.scene-bar.cur { outline: 2px solid var(--brand-2); outline-offset: 2px; }
.io { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.io h4 { margin: 0 0 6px; display: flex; align-items: center; gap: 6px; font-size: 12px; }
.io h4 .dot { width: 8px; height: 8px; border-radius: 2px; }
.fields { display: grid; grid-template-columns: 74px 1fr 74px; gap: 6px; }
.fields.two { grid-template-columns: 1fr 1fr; }
.fields.four { grid-template-columns: repeat(4, 1fr); }
.field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.field > span { color: var(--muted); font-size: 11px; }
.field select, .field input { width: 100%; }
.field input[type=checkbox], .check input[type=checkbox] { width: 16px; }
.adv-only { display: none !important; }
body.adv .adv-only { display: grid !important; }
.tabs { display: flex; gap: 8px; margin: 14px 0 12px; }
.tab { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px; border-radius: 9px; border: 1px solid transparent; background: transparent; cursor: pointer; color: var(--text); }
.tab:hover { background: var(--card-2); }
.tab.on { border-color: var(--brand-2); background: var(--brand-soft); color: var(--brand); font-weight: 600; }
.tab .badge { width: 6px; height: 6px; border-radius: 50%; background: var(--brand-2); }
.summary { color: var(--muted); margin-top: 8px; font-size: 11px; }
.not-in-scene { background: var(--card-2); border-radius: 10px; padding: 14px; text-align: center; color: var(--muted); }
.not-in-scene .btn { margin-top: 8px; }

.right-foot .seg { display: inline-flex; background: var(--card); border: 1px solid var(--border); border-radius: 9px; padding: 3px; }
.seg button { border: 0; background: transparent; padding: 5px 12px; border-radius: 6px; cursor: pointer; font-weight: 700; color: var(--muted); }
.seg button.on { background: var(--card-2); color: var(--text); box-shadow: var(--shadow); }

/* ---------- sheets ---------- */
.sheet-wrap { position: fixed; inset: 0; background: rgba(20, 22, 40, .35); display: flex; align-items: flex-end; justify-content: flex-start; padding: 10px; z-index: 10; }
.sheet { width: calc(50% - 5px); max-height: 82%; background: var(--card); border-radius: 14px; display: flex; flex-direction: column; box-shadow: 0 10px 40px rgba(0,0,0,.25); }
.sheet.wide { width: 100%; height: 100%; max-height: 100%; }
#previewSheet { z-index: 11; }
.sheet-head { display: flex; align-items: center; gap: 12px; padding: 16px 18px; border-bottom: 1px solid var(--border); }
.sheet-head h2 { margin: 0; font-size: 16px; flex: 1; }
.sheet-icon { width: 34px; height: 34px; border-radius: 9px; background: var(--brand-soft); color: var(--brand); display: inline-flex; align-items: center; justify-content: center; }
.sheet-body { overflow-y: auto; padding: 4px 18px 12px; flex: 1; }
.sheet-foot { display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-top: 1px solid var(--border); justify-content: flex-end; }
.sec { padding: 14px 0; border-bottom: 1px solid var(--border); }
.sec:last-child { border-bottom: 0; }
.sec-title { display: flex; align-items: center; gap: 8px; font-weight: 600; margin-bottom: 10px; }
.sec-title .grow { flex: 1; }
.pkg-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.color-field { display: flex; gap: 6px; align-items: center; }
.color-field input[type=color] { width: 34px; height: 32px; padding: 0; border: 1px solid var(--border); border-radius: 8px; background: var(--card); }
.color-field input[type=text] { flex: 1; }
.check { display: flex; align-items: center; gap: 8px; padding-top: 6px; }
.exit { background: var(--brand-soft); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
.exit-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.exit-head input { flex: 1; font-weight: 600; background: transparent; border-color: transparent; padding: 3px 4px; }
.exit-head .primary { color: var(--brand-2); font-weight: 600; }
.exit input[type=url] { width: 100%; }
.size-list { display: flex; flex-direction: column; gap: 6px; }
.size-list label { display: flex; align-items: center; gap: 8px; }
.dropdown { position: relative; }
.menu { position: absolute; bottom: calc(100% + 6px); left: 0; min-width: 280px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 8px 30px rgba(0,0,0,.18); padding: 6px; z-index: 5; }
.menu button { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 9px 10px; border-radius: 7px; cursor: pointer; }
.menu button:hover, .menu button.on { background: var(--card-2); }
.menu small { display: block; color: var(--muted); }
.files-count { display: inline-flex; align-items: center; gap: 4px; }
.previews { display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-start; padding-top: 16px; background: var(--card-2); }
.previews figure { margin: 0; }
.previews figcaption { color: var(--muted); margin-top: 6px; font-size: 11px; }
.previews iframe { border: 0; display: block; transform-origin: 0 0; }

</style>
</head>
<body>
<div id="app">
  <!-- ============================== LEFT: layer tree ============================== -->
  <aside class="panel left">
    <div class="pane-card toolbar">
      <button class="icon-btn" data-act="select-parent" title="Select parent layer in Figma"><i data-icon="arrow-up"></i></button>
      <button class="icon-btn" data-act="add-selection" title="Add the layers selected in Figma to the HTML"><i data-icon="arrow-right"></i></button>
      <button class="icon-btn" id="followBtn" data-act="toggle-follow" title="Follow Figma selection"><i data-icon="select"></i></button>
      <span class="grow"></span>
      <button class="text-btn" data-act="restore-session" title="Restore the last saved session"><i data-icon="history"></i>Restore session</button>
      <button class="icon-btn ghost" data-act="save-session" title="Save session snapshot"><i data-icon="save"></i></button>
    </div>

    <div class="search-row">
      <label class="search"><i data-icon="search"></i><input id="search" type="text" placeholder="Search node"></label>
      <button class="btn" id="filtersBtn" data-act="toggle-filters"><i data-icon="filter"></i>Filters</button>
    </div>
    <div id="filters" class="filters" hidden></div>
    <div id="bulkNodes" class="bulk" hidden></div>
    <div id="tree" class="tree"></div>

    <footer class="status-bar">
      <span id="status" class="status"><i data-icon="info"></i><span>Select a banner frame in Figma.</span></span>
      <button class="text-btn" data-act="open-package"><i data-icon="package"></i>Package</button>
    </footer>
  </aside>

  <!-- ============================== RIGHT: timeline & preview ============================== -->
  <section class="panel right">
    <div class="right-scroll">
      <div class="top-row">
        <button class="icon-btn" data-act="open-sync" title="Copy this animation to other sizes"><i data-icon="layout"></i></button>
        <select id="bannerSelect" class="size-select" title="Banner"></select>
        <button class="icon-btn" data-act="refresh" title="Re-export layers from Figma"><i data-icon="refresh"></i></button>
      </div>

      <div class="frames-row">
        <span class="label">FRAMES</span>
        <button class="mini-btn" data-act="scene-remove" title="Remove last frame">−</button>
        <span id="sceneCount" class="count">1</span>
        <button class="mini-btn" data-act="scene-add" title="Add frame">+</button>
        <span class="grow"></span>
        <label class="inline-field" title="How many times the banner plays">Plays
          <select id="playsSelect"><option value="1">1×</option><option value="2">2×</option><option value="3">3×</option><option value="0">∞</option></select>
        </label>
        <label class="inline-check" title="On the final play, the last frame skips its exits and stays on screen"><input type="checkbox" id="endOnLast">End on last frame</label>
        <span id="totalTime" class="muted"></span>
      </div>
      <div id="sceneDurations" class="scene-durations"></div>
      <input id="scrubber" type="range" min="0" max="10" step="0.01" value="0">
      <div class="transport">
        <button class="icon-btn ghost" id="playBtn" data-act="play" title="Play / pause"><i data-icon="play"></i></button>
        <button class="icon-btn ghost" data-act="restart" title="Restart"><i data-icon="restart"></i></button>
        <span id="timeLabel" class="muted mono">0.00s</span>
        <span class="grow"></span>
        <button class="icon-btn ghost" data-act="scene-prev" title="Previous frame"><i data-icon="chevron-left"></i></button>
        <span id="sceneLabel" class="scene-label">F1</span>
        <button class="icon-btn ghost" data-act="scene-next" title="Next frame"><i data-icon="chevron-right"></i></button>
        <button class="icon-btn ghost" id="outlineBtn" data-act="toggle-outline" title="Show element outlines"><i data-icon="eye"></i></button>
      </div>

      <div id="stage" class="stage">
        <div id="frameBox" class="frame-box"><iframe id="preview" title="Banner preview" sandbox="allow-scripts"></iframe></div>
        <div id="stageMsg" class="stage-msg">Select a banner frame in Figma.</div>
        <div class="zoom">
          <button class="mini-btn" data-act="zoom-out">−</button>
          <span id="zoomLabel">100%</span>
          <button class="mini-btn" data-act="zoom-in">+</button>
          <button class="mini-btn strong" data-act="zoom-fit">Fit</button>
        </div>
      </div>
      <div id="warnings" class="warnings"></div>

      <div id="bulkEls" class="bulk" hidden></div>
      <div id="elements" class="elements"></div>
    </div>

    <footer class="status-bar right-foot">
      <span id="sizeInfo" class="muted"></span>
      <span class="grow"></span>
      <div class="seg" id="modeSeg">
        <button data-act="mode" data-mode="fast" class="on">FAST</button>
        <button data-act="mode" data-mode="adv">ADV</button>
      </div>
    </footer>
  </section>
</div>

<!-- ============================== Package sheet ============================== -->
<div id="packageSheet" class="sheet-wrap" hidden>
  <div class="sheet">
    <div class="sheet-head">
      <span class="sheet-icon"><i data-icon="package"></i></span>
      <h2>Banner Package</h2>
      <button class="icon-btn ghost" data-act="close-package"><i data-icon="close"></i></button>
    </div>
    <div class="sheet-body" id="packageBody"></div>
    <div class="sheet-foot">
      <div class="dropdown" id="channelDrop">
        <button class="btn" data-act="toggle-channel"><span id="channelLabel">Channel</span><i data-icon="chevron-down"></i></button>
        <div class="menu" id="channelMenu" hidden></div>
      </div>
      <button class="btn" data-act="package-preview"><i data-icon="external"></i>Preview</button>
      <button class="btn primary" id="downloadAllBtn" data-act="download-all"><i data-icon="download"></i>Download all</button>
      <span class="muted files-count"><i data-icon="files"></i><span id="filesCount">0 files</span></span>
    </div>
  </div>
</div>

<!-- ============================== Preview all sizes ============================== -->
<div id="previewSheet" class="sheet-wrap" hidden>
  <div class="sheet wide">
    <div class="sheet-head">
      <span class="sheet-icon"><i data-icon="external"></i></span>
      <h2>Package preview</h2>
      <button class="btn" data-act="replay-all"><i data-icon="restart"></i>Replay all</button>
      <button class="icon-btn ghost" data-act="close-preview"><i data-icon="close"></i></button>
    </div>
    <div class="sheet-body previews" id="previewBody"></div>
  </div>

  function makeTrack(total) {

      last: function () { return pts.length ? pts[pts.length - 1].state : null; },
      add: function (t, state, ease) {

      let goneAt = sc.end;
      let hides = false;
      if (sc.final) {

      // Loop

        const period = Math.max(0.1, num(c.loop.t, 0.6));
        const start = inEnd + Math.max(0, num(c.loop.d, 0));

          fx.steps.forEach(function (step, j) {

            loop.add(start + (i + step[0]) * period, step[1], lastStep ? undefined : 'ease-in-out');

        }
        if (cycles > 0) loop.add(start + cycles * period, {});
      }
    }

    outer.add(total, outer.last());
    return { outer: outer, motion: motion, loop: loop };
  }

  function escapeHtml(s) {

  function previewControls(playLen) {

  /*
   * opts: { name, width, height, session, assets, pkg, channel, inline, preview, outline }

  function buildBanner(opts) {

    const session = opts.session;
    const assets = opts.assets;
    const pkg = opts.pkg || {};
    const exits = pkg.exits && pkg.exits.length ? pkg.exits : [{ name: 'Main exit', url: '' }];
    const tl = timeline(session);
    const total = r2(tl.total * 1000) / 1000;

    };

    let bg = (assets.background && assets.background.css) || '#ffffff';
    if (assets.background && assets.background.bytes) {
      bg += ' url("' + src(assets.background.bytes, assets.background.ext, 'background') + '") 0 0/100% 100% no-repeat';
    }

    const maskFiles = {};
    const elements = (session.elements || []).slice().reverse(); // back → front
    let index = 0;
    elements.forEach(function (el) {
      const a = assets.items && assets.items[el.id];
      if (!a) return;
      const compiled = compileElement(el, tl);
      if (!compiled) return;
      const i = index++;
      const base = String(i + 1).padStart(2, '0') + '-' + slug(el.name);

      let ox = 0, oy = 0, open = '', close = '';
      const mask = el.clip && el.maskId && assets.masks && assets.masks[el.maskId];
      if (mask) {
        if (!maskFiles[el.maskId]) maskFiles[el.maskId] = src(mask.bytes, mask.ext, 'mask-' + slug(el.maskName || 'shape'));
        const url = 'url("' + maskFiles[el.maskId] + '") 0 0/100% 100% no-repeat';
        ox = mask.x;
        oy = mask.y;
        css.push('.k' + i + '{left:' + r2(mask.x) + 'px;top:' + r2(mask.y) + 'px;width:' + r2(mask.width) + 'px;height:' + r2(mask.height) + 'px;-webkit-mask:' + url + ';mask:' + url + '}');
        open = '<div class="k k' + i + '">';
        close = '</div>';
      }

      const outerCss = compiled.outer.css('o' + i, OUTER_DEFAULTS);
      const motionCss = compiled.motion.css('m' + i, MOTION_DEFAULTS);
      const loopCss = compiled.loop.css('e' + i, LOOP_DEFAULTS);
      css.push('.l' + i + '{left:' + r2(a.x - ox) + 'px;top:' + r2(a.y - oy) + 'px;width:' + r2(a.width) + 'px;height:' + r2(a.height) + 'px' +
        (outerCss ? ';' + anim('o' + i) : '') + '}');
      if (motionCss) css.push('.l' + i + '>.m{' + anim('m' + i) + '}');
      if (loopCss) css.push('.l' + i + ' .e{' + anim('e' + i) + '}');
      [outerCss, motionCss, loopCss].forEach(function (k) { if (k) keyframes.push(k); });

      const exitIndex = num(el.exit, -1);
      const click = exitIndex >= 0 && exitIndex < exits.length ? ' onclick="return bannerExit(event,' + exitIndex + ')" style="cursor:pointer"' : '';
      markup.push(open + '<div class="l l' + i + '"' + click + '><div class="m"><div class="e"><img src="' +
        escapeHtml(src(a.bytes, a.ext, base)) + '" alt="' + escapeHtml(el.name) + '"></div></div></div>' + close);
    });

    const channel = opts.preview ? 'preview' : (opts.channel || 'html5');
    const ch = channelCode(channel, exits, opts.name, W, H);
    const radius = assets.radius ? 'border-radius:' + assets.radius + 'px;' : '';
    const border = pkg.border !== false
      ? '<div id="border" style="border-color:' + escapeHtml(pkg.borderColor || '#000000') + '"></div>'
      : '';

    const html = [
      '<!DOCTYPE html>',
      '<html lang="en"' + (opts.preview && opts.outline ? ' class="outline"' : '') + '>',
      '<head>',
      '<meta charset="utf-8">',
      '<meta name="ad.size" content="width=' + W + ',height=' + H + '">',
      '<title>' + escapeHtml(opts.name) + '</title>',
      ch.head,
      '<style>',
      '*{margin:0;padding:0;box-sizing:border-box}',
      'html,body{width:' + W + 'px;height:' + H + 'px;overflow:hidden;background:transparent}',
      '#banner{position:relative;display:block;width:' + W + 'px;height:' + H + 'px;overflow:hidden;cursor:pointer;' + radius + 'background:' + bg + '}',
      '#banner .k,#banner .l{position:absolute}',
      '#banner .l{will-change:transform,opacity}',
      '#banner .m,#banner .e,#banner img{display:block;width:100%;height:100%}',
      '#border{position:absolute;left:0;top:0;width:100%;height:100%;border:1px solid #000;pointer-events:none;' + radius + '}',
      '.outline #banner .l{outline:1px dashed rgba(236,72,153,.9);outline-offset:-1px}',
      css.join('\n'),
      keyframes.join('\n'),
      '@media (prefers-reduced-motion:reduce){#banner *{animation-delay:0s!important;animation-duration:1ms!important;animation-iteration-count:1!important}}',
      '</style>',
      '</head>',
      '<body>',
      ch.root,
      markup.join('\n'),
      border,
      ch.rootClose,
      opts.preview ? previewControls(tl.playLen) : '',
      '</body>',
      '</html>'
    ].join('\n');

    files.unshift({ name: 'index.html', data: html });
    ch.files.forEach(function (f) { files.push(f); });
    return { html: html, files: files, total: tl.total, playLen: tl.playLen };
  }

  // ---------------------------------------------------------------------------
  // Minimal ZIP writer (STORE — images are already compressed).
  // ---------------------------------------------------------------------------
  const CRC_TABLE = (function () {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
      t[n] = c >>> 0;
    }
    return t;
  })();

  function crc32(bytes) {
    let c = 0xFFFFFFFF;
    for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }

  function makeZip(files) {
    const enc = new TextEncoder();
    const now = new Date();
    const time = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
    const date = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
    const parts = [];
    const central = [];
    let offset = 0;

    files.forEach(function (f) {
      const data = typeof f.data === 'string' ? enc.encode(f.data) : f.data;
      const name = enc.encode(f.name);
      const crc = crc32(data);

      const local = new Uint8Array(30 + name.length);
      const lv = new DataView(local.buffer);
      lv.setUint32(0, 0x04034b50, true);
      lv.setUint16(4, 20, true);
      lv.setUint16(6, 0x0800, true);
      lv.setUint16(10, time, true);
      lv.setUint16(12, date, true);
      lv.setUint32(14, crc, true);
      lv.setUint32(18, data.length, true);
      lv.setUint32(22, data.length, true);
      lv.setUint16(26, name.length, true);
      local.set(name, 30);

      const cen = new Uint8Array(46 + name.length);
      const cv = new DataView(cen.buffer);
      cv.setUint32(0, 0x02014b50, true);
      cv.setUint16(4, 20, true);
      cv.setUint16(6, 20, true);
      cv.setUint16(8, 0x0800, true);
      cv.setUint16(12, time, true);
      cv.setUint16(14, date, true);
      cv.setUint32(16, crc, true);
      cv.setUint32(20, data.length, true);
      cv.setUint32(24, data.length, true);
      cv.setUint16(28, name.length, true);
      cv.setUint32(42, offset, true);
      cen.set(name, 46);

      parts.push(local, data);
      central.push(cen);
      offset += local.length + data.length;
    });

    const cdSize = central.reduce(function (s, c) { return s + c.length; }, 0);
    const end = new Uint8Array(22);
    const ev = new DataView(end.buffer);
    ev.setUint32(0, 0x06054b50, true);
    ev.setUint16(8, files.length, true);
    ev.setUint16(10, files.length, true);
    ev.setUint32(12, cdSize, true);
    ev.setUint32(16, offset, true);

    const all = parts.concat(central, [end]);
    const out = new Uint8Array(all.reduce(function (s, p) { return s + p.length; }, 0));
    let pos = 0;
    all.forEach(function (p) { out.set(p, pos); pos += p.length; });
    return out;
  }

  return {
    EASINGS: EASINGS,
    EASE_LABELS: EASE_LABELS,
    IN_PRESETS: IN_PRESETS,
    OUT_PRESETS: OUT_PRESETS,
    LOOP_EFFECTS: LOOP_EFFECTS,
    MOTION_PRESETS: MOTION_PRESETS,
    CHANNELS: CHANNELS,
    MIME: MIME,
    timeline: timeline,
    sceneStarts: sceneStarts,
    compileElement: compileElement,
    buildBanner: buildBanner,
    makeZip: makeZip,
    escapeHtml: escapeHtml,
    slug: slug
  };
});

</script>
<script>
/* Banner Automation — plugin UI. */
(function () {
  'use strict';

  const G = window.BannerGen;
  const esc = G.escapeHtml;
  const $ = (id) => document.getElementById(id);
  const clone = (v) => JSON.parse(JSON.stringify(v));

  // -------------------------------------------------------------------------
  // Icons (24px stroke icons)
  // -------------------------------------------------------------------------
  const ICONS = {

    'download': '<path d="M12 4v12M6 10l6 6 6-6M4 20h16"/>',
    'files': '<path d="M9 3h7l4 4v11a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M16 3v4h4M5 7v13a1 1 0 0 0 1 1h9"/>',
    'locate': '<circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>',
    'link': '<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
    'mask': '<path d="M9 4H5v16h4M15 4h4v16h-4M12 2v20"/>',
    'trash': '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
    'text': '<path d="M4 7V5h11v2M9.5 5v14M7.5 19h4M14 12v-1h7v1M17.5 11v8M16 19h3"/>',
    'frame': '<path d="M8 3v18M16 3v18M3 8h18M3 16h18"/>',
    'group': '<path d="M3 7a1 1 0 0 1 1-1h5l2 2h9a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/>',
    'image': '<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M21 16l-5-5-9 8"/>',
    'shape': '<rect x="4" y="4" width="16" height="16" rx="2"/>',
    'settings': '<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',
    'loop': '<path d="M17 2l4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/>',
    'motion': '<path d="M3 17c3-7 6-7 9 0s6 7 9 0"/><path d="M18 6l3 0 0 3"/>',
    'star': '<path d="M12 3l2.8 6 6.2.6-4.8 4.2 1.4 6.2-5.6-3.2-5.6 3.2 1.4-6.2L3 9.6 9.2 9z"/>',
    'in': '<path d="M10 17l5-5-5-5M15 12H3M14 4h5a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-5"/>',
    'out': '<path d="M15 17l5-5-5-5M20 12H8M10 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h5"/>'
  };

  function icon(name) {
    return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[name] || '') + '</svg>';
  }

  function hydrateIcons(root) {
    (root || document).querySelectorAll('i[data-icon]').forEach((i) => { i.outerHTML = icon(i.dataset.icon); });
  }

  // -------------------------------------------------------------------------
  // RPC with the Figma main thread
  // -------------------------------------------------------------------------
  let rpcSeq = 0;
  const waiting = {};

  function call(method, params) {
    return new Promise((resolve, reject) => {
      const id = ++rpcSeq;
      waiting[id] = { resolve, reject };
      parent.postMessage({ pluginMessage: { type: 'call', id, method, params: params || {} } }, '*');
    });
  }

  // -------------------------------------------------------------------------
  // Defaults & state
  // -------------------------------------------------------------------------
  const DEFAULT_EXPORT = { mode: 'framed', scale: 2, format: 'png' };
  const VECTOR_TYPES = ['VECTOR', 'BOOLEAN_OPERATION', 'STAR', 'LINE', 'ELLIPSE', 'POLYGON', 'RECTANGLE'];
  const CONTAINER_TYPES = ['GROUP', 'FRAME', 'COMPONENT', 'INSTANCE', 'COMPONENT_SET'];

  function defaultScene(on) {
    return {
      on: !!on,
      in: { p: 'fade', d: 0, t: 0.5, e: 'ease-out', dist: 30 },
      out: { p: 'fade', d: -0.5, t: 0.5, e: 'ease-in', dist: 30 },
      loop: { p: 'none', t: 0.6, d: 0, r: 2 },
      motion: { p: 'none', x: 0, y: 0, s: 1.1, r: 0, d: 0, e: 'linear' }
    };
  }

  function newSession() {
    return { v: 1, scenes: [{ dur: 4 }, { dur: 6 }], plays: 1, endOnLast: true, elements: [], exportOpts: {} };
  }

  function defaultPackage() {
    return { border: true, borderColor: '#000000', compress: true, channel: '', exits: [{ name: 'Main exit', url: '' }], exclude: {} };
  }

  function merge(def, val) {
    if (val === undefined || val === null) return clone(def);
    if (typeof def !== 'object' || def === null || Array.isArray(def)) return val;
    const out = {};
    Object.keys(def).forEach((k) => { out[k] = merge(def[k], val[k]); });
    Object.keys(val).forEach((k) => { if (!(k in out)) out[k] = val[k]; });
    return out;
  }

  function normalizeSession(raw) {
    const s = merge(newSession(), raw);
    if (!Array.isArray(s.scenes) || !s.scenes.length) s.scenes = [{ dur: 4 }];
    s.elements = (s.elements || []).map((el) => {
      const e = merge({ id: '', name: '', type: '', exit: -1, clip: true, maskId: null, maskName: null, scenes: [] }, el);
      e.scenes = s.scenes.map((_, i) => merge(defaultScene(false), e.scenes[i]));
      return e;
    });
    return s;
  }

  const S = {
    banners: [],
    ctx: null,
    pkg: defaultPackage(),
    scene: 0,
    open: null,
    tab: 'loop',
    follow: true,
    outline: false,
    expanded: {},
    search: '',
    filter: { kind: 'all', inHtml: false, hidden: true },
    checkedNodes: new Set(),
    checkedEls: new Set(),
    canvasSel: [],
    zoom: 'fit',
    playing: true,
    time: 0,
    playLen: 0,
    resume: null,
    ignoreTicksUntil: 0,
    scrubbing: false
  };

  const ctxs = {};

  function makeCtx(data, oldCache) {
    const ctx = {
      id: data.info.id,
      info: data.info,
      tree: data.tree,
      session: normalizeSession(data.session),
      index: {},
      order: [],
      cache: oldCache || { items: {}, masks: {}, bg: null, processed: {}, warnings: [], pending: null }
    };
    const walk = (nodes, parentNode, depth) => nodes.forEach((n) => {
      n.parent = parentNode;
      n.depth = depth;
      n.order = ctx.order.length;
      ctx.order.push(n);
      ctx.index[n.id] = n;
      walk(n.children, n, depth + 1);
    });
    walk(ctx.tree, null, 0);
    ctx.session.elements.forEach((el) => {
      const n = ctx.index[el.id];
      if (!n) return;
      el.name = n.name;
      el.type = n.type;
      el.maskId = n.maskId;
      el.maskName = n.maskName;
    });
    return ctx;
  }

  async function loadCtx(id, fresh) {
    if (!fresh && ctxs[id]) return ctxs[id];
    const data = await call('getBanner', { id });
    const old = ctxs[id];
    const ctx = makeCtx(data, old && old.cache);
    ctxs[id] = ctx;
    return ctx;
  }

  const sess = () => S.ctx && S.ctx.session;
  const elById = (id) => sess() && sess().elements.find((e) => e.id === id);
  const isAdded = (id) => !!sess() && sess().elements.some((e) => e.id === id);
  const expOf = (ctx, id) => Object.assign({}, DEFAULT_EXPORT, ctx.session.exportOpts[id]);

  function addedDescendants(ctx, id) {
    const node = ctx.index[id];
    if (!node) return [];
    const ids = new Set(ctx.session.elements.map((e) => e.id));
    const out = [];
    const walk = (n) => n.children.forEach((c) => { if (ids.has(c.id)) out.push(c.id); walk(c); });
    walk(node);
    return out;
  }

  // -------------------------------------------------------------------------
  // Persistence
  // -------------------------------------------------------------------------
  let saveTimer = null;
  function persist() {
    const ctx = S.ctx;
    if (!ctx) return;
    const b = S.banners.find((x) => x.id === ctx.id);
    if (b) b.elements = ctx.session.elements.length;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => call('saveSession', { id: ctx.id, session: ctx.session }).catch(showError), 300);
  }

  let pkgTimer = null;
  function persistPkg() {
    clearTimeout(pkgTimer);
    pkgTimer = setTimeout(() => call('savePackage', { pkg: S.pkg }).catch(showError), 300);
  }

  function setStatus(text, warn) {
    const el = $('status');
    el.innerHTML = icon('info') + '<span>' + esc(text) + '</span>';
    el.style.color = warn ? 'var(--warn)' : '';
  }

  function showError(e) {
    setStatus('Error: ' + (e && e.message || e), true);
  }

  // -------------------------------------------------------------------------
  // Labels
  // -------------------------------------------------------------------------
  const TYPE_LABELS = {
    TEXT: 'Text', GROUP: 'Group', FRAME: 'Frame', COMPONENT: 'Component', INSTANCE: 'Instance',
    RECTANGLE: 'Rectangle', ELLIPSE: 'Ellipse', VECTOR: 'Vector', BOOLEAN_OPERATION: 'Boolean',
    STAR: 'Star', LINE: 'Line', POLYGON: 'Polygon', COMPONENT_SET: 'Variants'
  };

  function typeLabel(n) {
    return TYPE_LABELS[n.type] || (n.type.charAt(0) + n.type.slice(1).toLowerCase().replace(/_/g, ' '));
  }

  function typeIcon(n) {
    if (!n) return 'shape';
    if (n.type === 'TEXT') return 'text';
    if (n.img) return 'image';
    if (n.type === 'GROUP') return 'group';
    if (CONTAINER_TYPES.indexOf(n.type) !== -1) return 'frame';
    return 'shape';
  }

  function options(map, value) {
    return Object.keys(map).map((k) => {
      const label = typeof map[k] === 'string' ? map[k] : map[k].label;
      return '<option value="' + esc(k) + '"' + (String(k) === String(value) ? ' selected' : '') + '>' + esc(label) + '</option>';
    }).join('');
  }

  // -------------------------------------------------------------------------
  // Left panel — layer tree
  // -------------------------------------------------------------------------
  function matchesFilter(n) {
    if (!S.filter.hidden && !n.visible) return false;
    if (S.filter.inHtml && !isAdded(n.id)) return false;
    const k = S.filter.kind;
    if (k === 'text' && n.type !== 'TEXT') return false;
    if (k === 'image' && !n.img) return false;
    if (k === 'vector' && (n.img || VECTOR_TYPES.indexOf(n.type) === -1)) return false;
    if (k === 'container' && CONTAINER_TYPES.indexOf(n.type) === -1) return false;
    if (S.search && n.name.toLowerCase().indexOf(S.search.toLowerCase()) === -1) return false;
    return true;
  }

  function renderTree() {
    const ctx = S.ctx;
    const box = $('tree');
    if (!ctx) {
      box.innerHTML = '<div class="empty">Select a banner frame in Figma (e.g. 300×250).<br>Its layers appear here — add the ones you want to animate.</div>';
      return;
    }
    const rows = [];
    const flat = !!S.search || S.filter.kind !== 'all' || S.filter.inHtml;
    if (flat) {
      ctx.order.forEach((n) => { if (matchesFilter(n)) rows.push({ n: n, depth: 0, flat: true }); });
    } else {
      const walk = (nodes) => nodes.forEach((n) => {
        if (!S.filter.hidden && !n.visible) return;
        rows.push({ n: n, depth: n.depth });
        if (S.expanded[n.id]) walk(n.children);
      });
      walk(ctx.tree);
    }
    box.innerHTML = rows.length ? rows.map(nodeCard).join('') : '<div class="empty">No layers match.</div>';
    renderBulkNodes();
  }

  function nodeCard(row) {
    const n = row.n;
    const ctx = S.ctx;
    const added = isAdded(n.id);
    const el = added ? elById(n.id) : null;
    const x = expOf(ctx, n.id);
    const hasKids = n.children.length && !row.flat;
    const meta = (added ? '<span class="ok">✓ In HTML</span> · ' : '') + n.w + ' × ' + n.h + ' · ' + typeLabel(n) +
      (n.isMask ? ' · mask' : '') + (!n.visible ? ' · <span class="hid">hidden</span>' : '') +
      (row.flat && n.parent ? ' · in ' + esc(n.parent.name) : '');
    return '<div class="node' + (added ? ' in-html' : '') + (S.canvasSel.indexOf(n.id) !== -1 ? ' canvas-sel' : '') + '" data-node="' + n.id + '" style="margin-left:' + Math.min(row.depth, 6) * 18 + 'px">' +
      '<div class="row">' +
        (hasKids ? '<button class="caret' + (S.expanded[n.id] ? '' : ' closed') + '" data-act="toggle-node" title="Expand">' + icon('chevron-down') + '</button>' : '<span class="caret-space"></span>') +
        '<input type="checkbox" class="cb" data-act="check-node"' + (S.checkedNodes.has(n.id) ? ' checked' : '') + '>' +
        '<span class="type-ic">' + icon(typeIcon(n)) + '</span>' +
        '<div class="info"><div class="name">' + esc(n.name) + '</div><div class="meta">' + meta + '</div></div>' +
        '<button class="icon-btn ghost sm" data-act="locate" title="Select in Figma">' + icon('locate') + '</button>' +
        '<button class="btn add-btn' + (added ? ' remove' : '') + '" data-act="' + (added ? 'remove-node' : 'add-node') + '">' + (added ? 'Remove' : '+ Add') + '</button>' +
      '</div>' +
      '<div class="row2">' +
        '<select data-xf="mode" title="Framed: crop to the banner · Full: keep the whole layer">' + options({ framed: 'Framed', full: 'Full' }, x.mode) + '</select>' +
        '<select data-xf="scale" title="Export scale">' + options({ 1: '1x', 2: '2x', 3: '3x' }, x.scale) + '</select>' +
        '<select data-xf="format" title="Image format">' + options({ png: 'PNG', jpg: 'JPG', svg: 'SVG' }, x.format) + '</select>' +
        '<span class="grow"></span>' +
        (el && n.maskId ? '<button class="icon-btn sm clip-btn' + (el.clip ? ' on' : '') + '" data-act="toggle-clip" title="Clip to mask “' + esc(n.maskName || '') + '”">' + icon('mask') + '</button>' : '') +
      '</div>' +

  function renderBulkNodes() {
    const bar = $('bulkNodes');
    const n = S.checkedNodes.size;
    bar.hidden = !n;
    if (!n) return;
    bar.innerHTML = '<b>' + n + ' selected</b><span class="grow"></span>' +
      '<button class="btn" data-act="bulk-add">+ Add</button><button class="btn" data-act="bulk-remove">Remove</button>' +
      '<button class="text-btn" data-act="bulk-clear-nodes">Clear</button>';
  }

  function renderFilters() {
    const f = $('filters');
    f.hidden = !S.showFilters;
    $('filtersBtn').classList.toggle('on', S.filter.kind !== 'all' || S.filter.inHtml || !S.filter.hidden);
    if (!S.showFilters) return;
    const kinds = { all: 'All', text: 'Text', image: 'Images', vector: 'Shapes', container: 'Groups & frames' };
    f.innerHTML = Object.keys(kinds).map((k) => '<button class="chip' + (S.filter.kind === k ? ' on' : '') + '" data-act="filter-kind" data-kind="' + k + '">' + kinds[k] + '</button>').join('') +
      '<span class="grow"></span>' +

      '<label class="inline-check"><input type="checkbox" data-filter="hidden"' + (S.filter.hidden ? ' checked' : '') + '>Show hidden</label>';
  }

  function addElements(ids) {
    const ctx = S.ctx;
    if (!ctx) return;
    const added = [];
    ids.forEach((id) => {
      const n = ctx.index[id];
      if (!n || isAdded(id)) return;
      const el = {
        id: id, name: n.name, type: n.type, exit: -1,
        clip: !!n.maskId, maskId: n.maskId, maskName: n.maskName,
        scenes: ctx.session.scenes.map((_, i) => defaultScene(i === S.scene))
      };
      // Keep Figma's stacking order: the list runs front → back.
      const list = ctx.session.elements;
      let pos = list.findIndex((e) => (ctx.index[e.id] ? ctx.index[e.id].order : -1) < n.order);
      if (pos === -1) pos = list.length;
      list.splice(pos, 0, el);
      added.push(el);
    });
    if (!added.length) return;
    S.open = added[added.length - 1].id;
    persist();
    renderTree();
    renderElements();
    schedulePreview();
    setStatus(added.length === 1 ? '“' + added[0].name + '” added as ' + added[0].type + '.' : added.length + ' elements added.');
  }

  function removeElements(ids) {
    const s = sess();
    if (!s) return;
    const before = s.elements.length;
    s.elements = s.elements.filter((e) => ids.indexOf(e.id) === -1);
    ids.forEach((id) => S.checkedEls.delete(id));
    if (ids.indexOf(S.open) !== -1) S.open = null;
    if (s.elements.length === before) return;
    persist();
    renderTree();
    renderElements();
    schedulePreview();
    setStatus((before - s.elements.length) + ' element' + (before - s.elements.length > 1 ? 's' : '') + ' removed.');
  }

  // Right panel — banner select, frames, transport
  // -------------------------------------------------------------------------

    const sel = $('bannerSelect');
    const cur = S.ctx && S.ctx.id;

      ? S.banners.map((b) => '<option value="' + b.id + '"' + (b.id === cur ? ' selected' : '') + '>' + b.width + '×' + b.height + ' · ' + esc(b.name) + (b.elements ? ' ●' : '') + '</option>').join('')
      : '<option>No frames on this page</option>';
    if (!cur && S.banners.length) sel.insertAdjacentHTML('afterbegin', '<option value="" selected>Choose banner…</option>');
  }

  function renderTimeline() {
    const s = sess();
    const scenes = s ? s.scenes : [];
    $('sceneCount').textContent = scenes.length;
    $('sceneDurations').innerHTML = scenes.map((sc, i) =>
      '<label class="scene-dur' + (i === S.scene ? ' cur' : '') + '" style="flex:' + Math.max(0.5, sc.dur) + '"><span class="tag">F' + (i + 1) + '</span>' +
      '<input type="number" min="0.5" step="0.5" data-scene-dur="' + i + '" value="' + sc.dur + '"></label>').join('');

      $('playsSelect').value = String(s.plays);

    return Math.round(n * 100) / 100;

    $('playBtn').innerHTML = icon(S.playing ? 'pause' : 'play');

    const s = sess();
    if (!s) return;
    S.scene = Math.max(0, Math.min(s.scenes.length - 1, i));
    if (seek) {
      S.time = sceneStart(S.scene) + s.scenes[S.scene].dur * 0.6;
      S.playing = false;
      sendPreview({ bannerCmd: 'seek', t: S.time });

    renderElements();

  function summary(el) {
    const sc = el.scenes[S.scene];
    if (!sc.on) return '';
    const parts = [G.IN_PRESETS[sc.in.p] + (sc.in.p !== 'none' ? ' ' + sc.in.t + 's' : ''), G.OUT_PRESETS[sc.out.p] + (sc.out.p !== 'none' ? ' ' + sc.out.t + 's' : '')];
    if (sc.loop.p !== 'none') parts.push(G.LOOP_EFFECTS[sc.loop.p].label + ' · ' + (sc.loop.r === 'inf' ? 'until exit' : sc.loop.r + '×'));
    if (sc.motion.p !== 'none') parts.push(G.MOTION_PRESETS[sc.motion.p].label);
    if (el.exit >= 0) parts.push('→ ' + exitLabel(el.exit));
    return parts.join(' · ');
  }

  function renderBulkEls() {
    const bar = $('bulkEls');
    const n = S.checkedEls.size;
    bar.hidden = !n;
    if (!n) return;
    const src = S.open && elById(S.open);
    bar.innerHTML = '<b>' + n + ' selected</b><span class="grow"></span>' +
      (src ? '<button class="btn" data-act="bulk-copy" title="Copy every frame’s In/Out/Loop/Motion">Copy animation from “' + esc(src.name) + '”</button>' : '<span class="muted">Open an element to copy its animation</span>') +
      '<button class="btn" data-act="bulk-delete">Remove</button><button class="text-btn" data-act="bulk-clear-els">Clear</button>';
